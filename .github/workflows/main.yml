name: Build SK Alert APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle & Configure Pre-installed Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle rsync
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Create Cordova Project & Copy Files
        run: |
          npm install -g cordova
          cordova create sk_alert_app com.sk.alert "SK Alert"
          rm -rf sk_alert_app/www/*
          rsync -av --exclude='sk_alert_app' --exclude='.git' --exclude='.github' ./ sk_alert_app/www/

      - name: Build Android APK
        working-directory: ./sk_alert_app
        run: |
          cordova platform add android@13.0.0
          cordova build android --debug -- --gradleArg=-PcdvMinSdkVersion=24

      - name: Prepare APK Artifact
        run: |
          cp sk_alert_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk ./SK-Alert.apk

      - name: Upload SK Alert APK
        uses: actions/upload-artifact@v4
        with:
          name: SK-Alert-APK
          path: ./SK-Alert.apk
          
