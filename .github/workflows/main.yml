name: Build SK Alert APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle & Configure Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle rsync jq
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build Vite React App & Prepare Cordova Project
        run: |
          # 1. Install dependencies bypassing the esbuild peer conflict
          npm install --legacy-peer-deps
          
          # 2. Build the Vite app with relative base paths
          npx vite build --base=./
          
          # 3. Create Cordova wrapper and copy compiled dist/ files
          npm install -g cordova
          cordova create sk_alert_app com.sk.alert "SK Alert"
          rm -rf sk_alert_app/www/*
          cp -r dist/* sk_alert_app/www/
          
          # 4. Strip 'crossorigin' attribute so Android WebView loads scripts cleanly
          sed -i 's/ crossorigin//g' sk_alert_app/www/index.html
          
          echo "Compiled files inside sk_alert_app/www/:"
          ls -la sk_alert_app/www/

      - name: Configure Cordova WebView for Vite ES Modules
        working-directory: ./sk_alert_app
        run: |
          # Enable https scheme, keep-running in background & cleartext so Vite ES modules, APIs and alarms work seamlessly
          sed -i 's|</widget>|  <allow-navigation href="*" />\n  <access origin="*" />\n  <preference name="scheme" value="https" />\n  <preference name="hostname" value="localhost" />\n  <preference name="AndroidInsecureFileModeEnabled" value="true" />\n  <preference name="KeepRunning" value="true" />\n</widget>|g' config.xml

      - name: Build Android APK
        working-directory: ./sk_alert_app
        run: |
          cordova platform add android@13.0.0

          # Copy Native Notification Bridge and Background Alarm Receiver into Android App
          cp ../android-bridge/MainActivity.java platforms/android/app/src/main/java/com/sk/alert/MainActivity.java
          cp ../android-bridge/NotificationBridge.java platforms/android/app/src/main/java/com/sk/alert/NotificationBridge.java
          cp ../android-bridge/NotificationReceiver.java platforms/android/app/src/main/java/com/sk/alert/NotificationReceiver.java

          # Patch AndroidManifest.xml with POST_NOTIFICATIONS, VIBRATE, WAKE_LOCK, and Alarm Receiver
          node ../android-bridge/patch-manifest.js platforms/android/app/src/main/AndroidManifest.xml

          cordova build android --debug -- --gradleArg=-PcdvMinSdkVersion=24

      - name: Prepare APK Artifact
        run: |
          cp sk_alert_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk ./SK-Alert.apk

      - name: Upload SK Alert APK
        uses: actions/upload-artifact@v4
        with:
          name: SK-Alert-APK
          path: ./SK-Alert.apk
          
