name: Build SK Alert APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Cordova & Create Project
        run: |
          npm install -g cordova
          cordova create sk_alert_app com.sk.alert "SK Alert"
          
          # Clear default template files and copy your repo's web files into www/
          rm -rf sk_alert_app/www/*
          
          # If your index.html is in the root, copy everything except build folder & git
          rsync -av --exclude='sk_alert_app' --exclude='.git' --exclude='.github' ./ sk_alert_app/www/

      - name: Build Android APK
        working-directory: ./sk_alert_app
        run: |
          cordova platform add android
          cordova build android --debug

      - name: Rename and Prepare APK
        run: |
          cp sk_alert_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk ./SK-Alert.apk

      - name: Upload SK Alert APK
        uses: actions/upload-artifact@v4
        with:
          name: SK-Alert-APK
          path: ./SK-Alert.apk
